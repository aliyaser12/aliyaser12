<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VANTA | Cybersecurity Education</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #05070b;
            color: #eafff7;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 7%;
            border-bottom: 1px solid rgba(0,255,157,.15);
            background: rgba(5,7,11,.95);
        }

        .brand {
            color: #00ff9d;
            font-size: 24px;
            font-weight: bold;
        }

        .brand span {
            color: #eafff7;
            font-size: 15px;
            margin-right: 8px;
        }

        main {
            width: min(1100px, 90%);
            margin: auto;
        }

        .hero {
            padding: 90px 0 50px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(50px, 10vw, 100px);
            margin: 0;
            color: #00ff9d;
            text-shadow: 0 0 30px rgba(0,255,157,.25);
        }

        .hero p {
            color: #9aa8a2;
            font-size: 18px;
        }

        .auth {
            width: min(430px, 100%);
            margin: 30px auto 80px;
            padding: 30px;
            background: #0b1118;
            border: 1px solid rgba(0,255,157,.2);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0,0,0,.35);
        }

        .auth h2 {
            margin-top: 0;
            color: #00ff9d;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 7px 0;
            border: 1px solid #26343d;
            border-radius: 8px;
            background: #05070b;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #00ff9d;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: 0;
            border-radius: 8px;
            background: #00ff9d;
            color: #03120c;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.1);
        }

        #userPanel {
            display: none;
            text-align: center;
        }

        #userEmail {
            color: #00ff9d;
            margin: 15px 0;
        }

        #status {
            min-height: 22px;
            margin-top: 15px;
            color: #9aa8a2;
        }

        footer {
            padding: 30px;
            text-align: center;
            color: #68756f;
            border-top: 1px solid rgba(0,255,157,.1);
        }
    </style>
</head>

<body>

<header>
    <div class="brand">
        VANTA
        <span>× ALI YASER</span>
    </div>
</header>

<main>

    <section class="hero">
        <h1>VANTA</h1>
        <p>Cybersecurity • Education • Research</p>
        <p>منصة تعليمية للأمن السيبراني والتدريب العملي الآمن.</p>
    </section>

    <section class="auth">

        <div id="authPanel">

            <h2>إنشاء حساب / تسجيل الدخول</h2>

            <input
                id="email"
                type="email"
                placeholder="البريد الإلكتروني"
                autocomplete="email"
            >

            <input
                id="password"
                type="password"
                placeholder="كلمة المرور"
                autocomplete="current-password"
            >

            <input
                id="username"
                type="text"
                placeholder="اسم المستخدم عند التسجيل"
                autocomplete="nickname"
            >

            <button onclick="registerUserUI()">
                إنشاء حساب
            </button>

            <button onclick="loginUserUI()">
                تسجيل الدخول
            </button>

            <div id="status"></div>

        </div>

        <div id="userPanel">

            <h2>مرحبًا بك في VANTA</h2>

            <div id="userEmail"></div>

            <button onclick="logoutUserUI()">
                تسجيل الخروج
            </button>

        </div>

    </section>

</main>

<footer>
    <b style="color:#00ff9d;">VANTA v92.61</b><br>
    Cybersecurity • Education • Research<br>
    Built by Ali Yaser<br>
    © 2026 Ali Yaser
</footer>

<script src="app.js"></script>

</body>
</html>
